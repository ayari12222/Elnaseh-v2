name: elnaseh_app
description: تطبيق الناصح للتواصل بدون إنترنت
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  torch_light: ^1.1.0
  share_plus: ^7.2.0
  image_gallery_saver_plus: ^4.0.1
  supabase_flutter: ^2.5.0
  font_awesome_flutter: ^10.7.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.0
  nearby_connections: ^4.3.0
  geolocator: ^12.0.0
  # تم تحديث flutter_blue_plus ليتوافق مع flutter_mesh_network
  flutter_blue_plus: ^2.2.1
  flutter_mesh_network: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# هذا القسم يحل تعارض حزمة path
dependency_overrides:
  path: ^1.9.1

flutter:
  uses-material-design: true
