name: elnaseh_app
description: تطبيق الناصح للتواصل بدون إنترنت
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # المكتبات الأصلية (لم نمسها)
  audioplayers: ^6.0.0
  torch_light: ^1.1.0
  share_plus: ^7.2.0
  image_gallery_saver_plus: ^4.0.1
  supabase_flutter: ^2.5.0
  font_awesome_flutter: ^10.7.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.0
  nearby_connections: ^4.3.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  flutter_blue_plus: ^2.2.1         # ✅ تمت إعادتها
  flutter_mesh_network: ^0.1.3      # ✅ تمت إعادتها
  encrypt: ^5.0.3

  # المكتبات الجديدة (لقاعدة البيانات والـ Mesh)
  sqflite: ^2.3.3
  path: ^1.9.0
  crypto: ^3.0.3

  # ✅ إضافات المنصة الإعلامية (Firebase)
  firebase_core: ^2.24.0
  cloud_firestore: ^4.13.0
  firebase_auth: ^4.15.0
  image_picker: ^1.0.7
  firebase_storage: ^11.5.0         # ✅ لرفع الصور
  
  # ✅ إضافات استوديو النشر (Post Studio)
  screenshot: ^2.1.0                # ✅ لتحويل التصميم إلى صورة
  google_fonts: ^6.1.0              # ✅ لخطوط عربية احترافية
  flutter_colorpicker: ^1.0.3       # ✅ لاختيار الألوان

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# لحل تعارض حزمة path
dependency_overrides:
  path: ^1.9.1

flutter:
  uses-material-design: true
