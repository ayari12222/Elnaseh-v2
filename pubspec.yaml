name: elnaseh_app
description: تطبيق الناصح للتواصل بدون إنترنت
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # المكتبات القديمة الخاصة بك
  audioplayers: ^6.0.0
  torch_light: ^1.1.0
  share_plus: ^7.2.0
  image_gallery_saver_plus: ^4.0.1
  supabase_flutter: ^2.5.0
  font_awesome_flutter: ^10.7.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.0
  nearby_connections: ^4.3.0
  geolocator: ^12.0.0
  flutter_blue_plus: ^2.2.1
  flutter_mesh_network: ^0.1.3
  encrypt: ^5.0.3

  # ✅ المكتبات الجديدة (لحفظ الرسائل وإدارة قاعدة البيانات)
  sqflite: ^2.3.3
  path: ^1.9.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# هذا القسم يحل تعارض حزمة path
dependency_overrides:
  path: ^1.9.1

flutter:
  uses-material-design: true

  # ✅ هذا القسم هو ما كان ينقصك ليعمل الصوت!
  # تأكد أن ملف الصوت موجود في مجلد اسمه assets في جذر المشروع
  assets:
    - assets/war-alarm-sound-long.mp3
