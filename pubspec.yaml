name: elnaseh_app
description: تطبيق الناصح للتواصل بدون إنترنت
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  torch_light: ^1.1.0
  share_plus: ^7.2.0
  image_gallery_saver_plus: ^4.0.1
  supabase_flutter: ^2.5.0
  font_awesome_flutter: ^10.7.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # هذا هو القسم الجديد الذي يخبر التطبيق بمكان ملف الصوت
  assets:
    - assets/siren.mp3
