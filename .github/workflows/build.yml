name: Build Android APK

on:
  push:
    branches: [ "stable", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      # 1. إنشاء مجلد android وملف AndroidManifest.xml
      - name: Generate Android Files
        run: flutter create --platforms=android .

      # إضافة الصلاحيات إلى الملف الذي تم إنشاؤه 2.
      - name: Add Camera and Flash Permissions
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST_FILE"

      # تحميل المكتبات وبناء التطبيق 3.
      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false -Dlint.skip=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elnaseh-APK
          path: build/app/outputs/flutter-apk/app-release.apk
